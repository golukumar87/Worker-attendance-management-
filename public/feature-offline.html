<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline Sync | AttendPro</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="hero-style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
  <header class="page-hero">
    <nav class="hero-nav">
      <div class="nav-container">
        <div class="logo">
          <i class="fas fa-clock"></i>
          <span>AttendPro</span>
        </div>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="features.html" class="nav-link">Features</a></li>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </nav>
    <div class="page-hero-content">
      <h1 class="page-hero-title">Offline Sync</h1>
      <p class="page-hero-subtitle">Queue attendance actions offline and auto-sync when connectivity is restored.</p>
    </div>
  </header>

  <section class="page-section">
    <div class="container">
      <div class="detail-card feature-box">
        <h2>Sync Controls</h2>
        <form id="offlineForm" class="detail-form">
          <div class="detail-field">
            <label>Queue Limit</label>
            <input type="number" id="queueLimit" placeholder="Max offline actions" />
          </div>
          <div class="detail-field">
            <label>Auto Sync Interval (min)</label>
            <input type="number" id="syncInterval" placeholder="e.g. 15" />
          </div>
          <div class="detail-field">
            <label>Conflict Policy</label>
            <select id="conflictPolicy">
              <option value="latest">Latest Wins</option>
              <option value="manual">Manual Review</option>
              <option value="server">Server Wins</option>
            </select>
          </div>
          <div class="detail-toggle">
            <label>Enable Offline Queue</label>
            <input type="checkbox" id="enableOffline" checked />
          </div>
          <div class="detail-form-actions">
            <button class="hero-btn-primary" type="submit"><i class="fas fa-save"></i> Save Settings</button>
            <button class="hero-btn-secondary" type="button" id="resetOffline"><i class="fas fa-rotate-left"></i> Reset</button>
          </div>
        </form>
        <div id="offlineMsg" class="demo-result"></div>
      </div>
    </div>
  </section>

  <script>
    const key = 'offlineSyncSettings';
    const form = document.getElementById('offlineForm');
    const msg = document.getElementById('offlineMsg');
    const queueLimit = document.getElementById('queueLimit');
    const syncInterval = document.getElementById('syncInterval');
    const conflictPolicy = document.getElementById('conflictPolicy');
    const enableOffline = document.getElementById('enableOffline');
    const resetBtn = document.getElementById('resetOffline');

    function loadSettings() {
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      queueLimit.value = data.queueLimit || '';
      syncInterval.value = data.syncInterval || '';
      conflictPolicy.value = data.conflictPolicy || 'latest';
      enableOffline.checked = data.enableOffline !== false;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        queueLimit: queueLimit.value,
        syncInterval: syncInterval.value,
        conflictPolicy: conflictPolicy.value,
        enableOffline: enableOffline.checked
      };
      localStorage.setItem(key, JSON.stringify(data));
      msg.textContent = 'Offline sync settings saved.';
    });

    resetBtn.addEventListener('click', () => {
      localStorage.removeItem(key);
      loadSettings();
      msg.textContent = 'Settings reset.';
    });

    loadSettings();
  </script>
</body>
</html>
