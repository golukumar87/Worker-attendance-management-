<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audit Trail | AttendPro</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="hero-style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
  <header class="page-hero">
    <nav class="hero-nav">
      <div class="nav-container">
        <div class="logo">
          <i class="fas fa-clock"></i>
          <span>AttendPro</span>
        </div>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="features.html" class="nav-link">Features</a></li>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </nav>
    <div class="page-hero-content">
      <h1 class="page-hero-title">Audit Trail</h1>
      <p class="page-hero-subtitle">Immutable logs for compliance and change tracking.</p>
    </div>
  </header>

  <section class="page-section">
    <div class="container">
      <div class="detail-card feature-box">
        <h2>Audit Settings</h2>
        <form id="auditForm" class="detail-form">
          <div class="detail-field">
            <label>Retention (months)</label>
            <input type="number" id="retention" placeholder="e.g. 12" />
          </div>
          <div class="detail-toggle">
            <label>Lock Changes</label>
            <input type="checkbox" id="lockChanges" />
          </div>
          <div class="detail-form-actions">
            <button class="hero-btn-primary" type="submit"><i class="fas fa-save"></i> Save Settings</button>
            <button class="hero-btn-secondary" type="button" id="resetAudit"><i class="fas fa-rotate-left"></i> Reset</button>
          </div>
        </form>
        <div id="auditMsg" class="demo-result"></div>
      </div>
    </div>
  </section>

  <script>
    const key = 'auditTrailSettings';
    const form = document.getElementById('auditForm');
    const msg = document.getElementById('auditMsg');
    const retention = document.getElementById('retention');
    const lockChanges = document.getElementById('lockChanges');
    const resetBtn = document.getElementById('resetAudit');

    function loadSettings() {
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      retention.value = data.retention || '';
      lockChanges.checked = Boolean(data.lockChanges);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        retention: retention.value,
        lockChanges: lockChanges.checked
      };
      localStorage.setItem(key, JSON.stringify(data));
      msg.textContent = 'Audit trail settings saved.';
    });

    resetBtn.addEventListener('click', () => {
      localStorage.removeItem(key);
      loadSettings();
      msg.textContent = 'Settings reset.';
    });

    loadSettings();
  </script>
</body>
</html>
