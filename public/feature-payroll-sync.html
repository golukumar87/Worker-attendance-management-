<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payroll Sync | AttendPro</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="hero-style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
  <header class="page-hero">
    <nav class="hero-nav">
      <div class="nav-container">
        <div class="logo">
          <i class="fas fa-clock"></i>
          <span>AttendPro</span>
        </div>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="features.html" class="nav-link">Features</a></li>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </nav>
    <div class="page-hero-content">
      <h1 class="page-hero-title">Payroll Sync</h1>
      <p class="page-hero-subtitle">Seamless payroll exports and provider integrations.</p>
    </div>
  </header>

  <section class="page-section">
    <div class="container">
      <div class="detail-card feature-box">
        <h2>Sync Settings</h2>
        <form id="payrollForm" class="detail-form">
          <div class="detail-field">
            <label>Provider Name</label>
            <input type="text" id="providerName" placeholder="e.g. ADP" />
          </div>
          <div class="detail-field">
            <label>Sync Frequency</label>
            <select id="syncFrequency">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </div>
          <div class="detail-toggle">
            <label>Auto Sync Enabled</label>
            <input type="checkbox" id="autoSync" checked />
          </div>
          <div class="detail-form-actions">
            <button class="hero-btn-primary" type="submit"><i class="fas fa-save"></i> Save Settings</button>
            <button class="hero-btn-secondary" type="button" id="resetPayroll"><i class="fas fa-rotate-left"></i> Reset</button>
          </div>
        </form>
        <div id="payrollMsg" class="demo-result"></div>
      </div>
    </div>
  </section>

  <script>
    const key = 'payrollSyncSettings';
    const form = document.getElementById('payrollForm');
    const msg = document.getElementById('payrollMsg');
    const providerName = document.getElementById('providerName');
    const syncFrequency = document.getElementById('syncFrequency');
    const autoSync = document.getElementById('autoSync');
    const resetBtn = document.getElementById('resetPayroll');

    function loadSettings() {
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      providerName.value = data.providerName || '';
      syncFrequency.value = data.syncFrequency || 'monthly';
      autoSync.checked = data.autoSync !== false;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        providerName: providerName.value,
        syncFrequency: syncFrequency.value,
        autoSync: autoSync.checked
      };
      localStorage.setItem(key, JSON.stringify(data));
      msg.textContent = 'Payroll sync settings saved.';
    });

    resetBtn.addEventListener('click', () => {
      localStorage.removeItem(key);
      loadSettings();
      msg.textContent = 'Settings reset.';
    });

    loadSettings();
  </script>
</body>
</html>
