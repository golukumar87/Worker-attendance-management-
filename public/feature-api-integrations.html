<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>API Integrations | AttendPro</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="hero-style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
  <header class="page-hero">
    <nav class="hero-nav">
      <div class="nav-container">
        <div class="logo">
          <i class="fas fa-clock"></i>
          <span>AttendPro</span>
        </div>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="features.html" class="nav-link">Features</a></li>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </nav>
    <div class="page-hero-content">
      <h1 class="page-hero-title">API Integrations</h1>
      <p class="page-hero-subtitle">Connect HRMS, payroll, and analytics platforms.</p>
    </div>
  </header>

  <section class="page-section">
    <div class="container">
      <div class="detail-card feature-box">
        <h2>Integration Settings</h2>
        <form id="apiForm" class="detail-form">
          <div class="detail-field">
            <label>Webhook URL</label>
            <input type="text" id="webhookUrl" placeholder="https://..." />
          </div>
          <div class="detail-field">
            <label>API Key</label>
            <input type="text" id="apiKey" placeholder="Generate / paste key" />
          </div>
          <div class="detail-toggle">
            <label>Enable Integrations</label>
            <input type="checkbox" id="enableApi" checked />
          </div>
          <div class="detail-form-actions">
            <button class="hero-btn-primary" type="submit"><i class="fas fa-save"></i> Save Settings</button>
            <button class="hero-btn-secondary" type="button" id="resetApi"><i class="fas fa-rotate-left"></i> Reset</button>
          </div>
        </form>
        <div id="apiMsg" class="demo-result"></div>
      </div>
    </div>
  </section>

  <script>
    const key = 'apiIntegrationSettings';
    const form = document.getElementById('apiForm');
    const msg = document.getElementById('apiMsg');
    const webhookUrl = document.getElementById('webhookUrl');
    const apiKey = document.getElementById('apiKey');
    const enableApi = document.getElementById('enableApi');
    const resetBtn = document.getElementById('resetApi');

    function loadSettings() {
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      webhookUrl.value = data.webhookUrl || '';
      apiKey.value = data.apiKey || '';
      enableApi.checked = data.enableApi !== false;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        webhookUrl: webhookUrl.value,
        apiKey: apiKey.value,
        enableApi: enableApi.checked
      };
      localStorage.setItem(key, JSON.stringify(data));
      msg.textContent = 'API integration settings saved.';
    });

    resetBtn.addEventListener('click', () => {
      localStorage.removeItem(key);
      loadSettings();
      msg.textContent = 'Settings reset.';
    });

    loadSettings();
  </script>
</body>
</html>
