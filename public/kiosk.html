<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kiosk Mode | AttendPro</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="dashboard-page">
  <div class="app-container" style="display:block; padding: 24px;">
    <div class="attendance-form-container">
      <h2>Kiosk Mode</h2>
      <p class="muted-text">Front-desk attendance screen. Use employee ID to check in/out.</p>
      <form id="kioskForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Employee ID</label>
            <input type="text" id="kioskEmployeeId" required />
          </div>
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="kioskName" required />
          </div>
          <div class="form-group">
            <label>Department</label>
            <select id="kioskDepartment">
              <option value="IT">IT</option>
              <option value="HR">HR</option>
              <option value="Finance">Finance</option>
              <option value="Marketing">Marketing</option>
              <option value="Operations">Operations</option>
              <option value="Sales">Sales</option>
            </select>
          </div>
          <div class="form-group">
            <label>Shift</label>
            <select id="kioskShift">
              <option value="Day">Day</option>
              <option value="Night">Night</option>
              <option value="Extra Work">Extra Work</option>
            </select>
          </div>
          <div class="form-group">
            <label>Location</label>
            <input type="text" id="kioskLocation" readonly />
          </div>
        </div>
        <div class="marks-actions">
          <button class="btn-primary" type="button" onclick="kioskCheckIn()">Check In</button>
          <button class="btn-secondary" type="button" onclick="kioskCheckOut()">Check Out</button>
        </div>
      </form>
      <p class="muted-text" id="kioskStatus"></p>
    </div>
  </div>
  <script src="kiosk.js"></script>
</body>
</html>
