<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cloud Backup | AttendPro</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="hero-style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
  <header class="page-hero">
    <nav class="hero-nav">
      <div class="nav-container">
        <div class="logo">
          <i class="fas fa-clock"></i>
          <span>AttendPro</span>
        </div>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="features.html" class="nav-link">Features</a></li>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </nav>
    <div class="page-hero-content">
      <h1 class="page-hero-title">Cloud Backup</h1>
      <p class="page-hero-subtitle">Safe storage with daily backups and quick recovery.</p>
    </div>
  </header>

  <section class="page-section">
    <div class="container">
      <div class="detail-card feature-box">
        <div class="feature-detail-layout">
          <div class="feature-visual feature-visual-cloud">
            <i class="fas fa-cloud-upload-alt"></i>
            <span>Backup Vault</span>
            <div class="feature-visual-caption">Secure cloud storage</div>
          </div>
          <div class="feature-detail-content">
            <h2>Backup Controls</h2>
            <form id="cloudForm" class="detail-form">
              <div class="detail-toggle">
                <label>Enable Cloud Backup</label>
                <input type="checkbox" id="cloudEnabled" checked />
              </div>
              <div class="detail-field">
                <label>Backup Frequency</label>
                <select id="cloudFrequency">
                  <option value="daily">Daily</option>
                  <option value="weekly">Weekly</option>
                  <option value="monthly">Monthly</option>
                </select>
              </div>
              <div class="detail-field">
                <label>Backup Time</label>
                <input type="time" id="cloudTime" />
              </div>
              <div class="detail-field">
                <label>Retention Days</label>
                <input type="number" id="cloudRetention" min="7" max="365" placeholder="e.g. 30" />
              </div>
              <div class="detail-toggle">
                <label>Encryption Enabled</label>
                <input type="checkbox" id="cloudEncryption" checked />
              </div>
              <div class="detail-form-actions">
                <button class="hero-btn-primary" type="submit"><i class="fas fa-save"></i> Save Settings</button>
                <button class="hero-btn-secondary" type="button" id="cloudReset"><i class="fas fa-rotate-left"></i> Reset</button>
                <button class="hero-btn-secondary" type="button" id="cloudTest"><i class="fas fa-rotate"></i> Test Restore</button>
                <a class="hero-btn-secondary" href="dashboard.html">Open Dashboard</a>
              </div>
            </form>
            <div id="cloudMsg" class="demo-result"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const key = 'cloudBackupSettings';
    const form = document.getElementById('cloudForm');
    const msg = document.getElementById('cloudMsg');

    const fields = {
      enabled: document.getElementById('cloudEnabled'),
      frequency: document.getElementById('cloudFrequency'),
      time: document.getElementById('cloudTime'),
      retention: document.getElementById('cloudRetention'),
      encryption: document.getElementById('cloudEncryption')
    };

    function loadSettings() {
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      fields.enabled.checked = data.enabled !== false;
      fields.frequency.value = data.frequency || 'daily';
      fields.time.value = data.time || '';
      fields.retention.value = data.retention || '';
      fields.encryption.checked = data.encryption !== false;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        enabled: fields.enabled.checked,
        frequency: fields.frequency.value,
        time: fields.time.value,
        retention: fields.retention.value,
        encryption: fields.encryption.checked
      };
      localStorage.setItem(key, JSON.stringify(data));
      msg.textContent = 'Backup settings saved.';
    });

    document.getElementById('cloudReset').addEventListener('click', () => {
      localStorage.removeItem(key);
      loadSettings();
      msg.textContent = 'Settings reset.';
    });

    document.getElementById('cloudTest').addEventListener('click', () => {
      msg.textContent = 'Test restore started. You will receive a status update shortly.';
    });

    loadSettings();
  </script>
</body>
</html>
