<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quick Demo - Analyze Reports</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="hero-style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    .demo-page { padding: 40px 0; }
    .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .demo-card { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 18px; padding: 22px; color: #e2e8f0; }
    .demo-card h2 { margin-bottom: 10px; }
    .demo-field { display: grid; gap: 6px; margin-bottom: 12px; }
    .demo-field label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
    .demo-field input, .demo-field select { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(148, 163, 184, 0.35); border-radius: 10px; padding: 10px 12px; color: #e2e8f0; }
    .demo-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .demo-result { margin-top: 12px; font-size: 0.9rem; color: #cbd5f5; word-break: break-word; }
    .demo-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .demo-table th, .demo-table td { border-bottom: 1px solid rgba(148, 163, 184, 0.2); padding: 8px; text-align: left; }
  </style>
</head>
<body>
  <header class="page-hero">
    <nav class="hero-nav">
      <div class="nav-container">
        <div class="logo">
          <i class="fas fa-clock"></i>
          <span>AttendPro</span>
        </div>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="features.html" class="nav-link">Features</a></li>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </nav>
    <div class="page-hero-content">
      <h1 class="page-hero-title">Analyze Reports Demo</h1>
      <p class="page-hero-subtitle">Generate analytics and export for HR.</p>
      <div class="page-hero-actions">
        <button class="hero-btn-primary" onclick="location.href='features.html#demo'"><i class="fas fa-arrow-left"></i> Back to Demo</button>
      </div>
    </div>
  </header>

  <section class="page-section demo-page">
    <div class="container demo-grid">
      <div class="demo-card">
        <h2>Generate Report</h2>
        <form id="reportForm">
          <div class="demo-field">
            <label>Start Date</label>
            <input type="date" name="startDate" required />
          </div>
          <div class="demo-field">
            <label>End Date</label>
            <input type="date" name="endDate" required />
          </div>
          <div class="demo-field">
            <label>Department</label>
            <select name="department">
              <option value="">All</option>
              <option value="IT">IT</option>
              <option value="HR">HR</option>
              <option value="Finance">Finance</option>
              <option value="Marketing">Marketing</option>
              <option value="Operations">Operations</option>
              <option value="Sales">Sales</option>
            </select>
          </div>
          <div class="demo-actions">
            <button class="hero-btn-primary" type="submit"><i class="fas fa-chart-line"></i> Generate</button>
            <button class="hero-btn-secondary" type="button" id="exportCsvBtn"><i class="fas fa-file-csv"></i> Export CSV</button>
            <button class="hero-btn-secondary" type="button" id="exportPdfBtn"><i class="fas fa-file-pdf"></i> Export PDF</button>
            <button class="hero-btn-secondary" type="reset"><i class="fas fa-rotate-left"></i> Reset</button>
          </div>
        </form>
        <div class="demo-result" id="reportResult"></div>
      </div>

      <div class="demo-card">
        <h2>Report Preview</h2>
        <div id="reportTableWrap">
          <table class="demo-table" id="reportTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Total</th>
                <th>Present</th>
                <th>Late</th>
                <th>Absent</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="5">No data yet.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <script>
    const API_BASE = (() => {
      if (window.location.protocol === 'file:') return 'http://localhost:3000';
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if (window.location.port && window.location.port !== '3000') {
          return 'http://localhost:3000';
        }
      }
      return window.location.origin;
    })();

    const apiUrl = (path) => `${API_BASE}${path}`;

    const reportForm = document.getElementById('reportForm');
    const reportResult = document.getElementById('reportResult');
    const reportTableBody = document.querySelector('#reportTable tbody');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const exportPdfBtn = document.getElementById('exportPdfBtn');
    let lastReportData = [];

    reportForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(reportForm);
      const params = new URLSearchParams(formData).toString();
      const res = await fetch(apiUrl(`/api/attendance/report?${params}`));
      const data = await res.json().catch(() => ({}));
      if (!data.success) {
        reportResult.textContent = data.message || 'Unable to fetch report.';
        return;
      }
      reportResult.textContent = `Report loaded: ${data.data.length} day(s).`;
      if (!data.data.length) {
        reportTableBody.innerHTML = '<tr><td colspan="5">No records found.</td></tr>';
        lastReportData = [];
        return;
      }
      lastReportData = data.data;
      reportTableBody.innerHTML = data.data.map(row => `
        <tr>
          <td>${row.date}</td>
          <td>${row.total}</td>
          <td>${row.present}</td>
          <td>${row.late}</td>
          <td>${row.absent}</td>
        </tr>
      `).join('');
    });

    exportCsvBtn.addEventListener('click', () => {
      if (!lastReportData.length) {
        reportResult.textContent = 'Generate a report first.';
        return;
      }
      const headers = ['Date', 'Total', 'Present', 'Late', 'Absent'];
      const rows = lastReportData.map(row => [row.date, row.total, row.present, row.late, row.absent]);
      const csv = [headers, ...rows].map(line => line.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'attendance-report.csv';
      link.click();
      URL.revokeObjectURL(url);
    });

    exportPdfBtn.addEventListener('click', () => {
      if (!lastReportData.length) {
        reportResult.textContent = 'Generate a report first.';
        return;
      }
      const rows = lastReportData.map(row => `
        <tr>
          <td>${row.date}</td>
          <td>${row.total}</td>
          <td>${row.present}</td>
          <td>${row.late}</td>
          <td>${row.absent}</td>
        </tr>
      `).join('');
      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
          <head>
            <title>Attendance Report</title>
            <style>
              body { font-family: Arial, sans-serif; padding: 20px; }
              h1 { font-size: 20px; margin-bottom: 12px; }
              table { width: 100%; border-collapse: collapse; }
              th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
            </style>
          </head>
          <body>
            <h1>Attendance Report</h1>
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Total</th>
                  <th>Present</th>
                  <th>Late</th>
                  <th>Absent</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    });
  </script>
</body>
</html>
