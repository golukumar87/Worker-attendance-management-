<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Analytics | AttendPro</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="hero-style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>
  <header class="page-hero">
    <nav class="hero-nav">
      <div class="nav-container">
        <div class="logo">
          <i class="fas fa-clock"></i>
          <span>AttendPro</span>
        </div>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="features.html" class="nav-link">Features</a></li>
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </nav>
    <div class="page-hero-content">
      <h1 class="page-hero-title">Advanced Analytics</h1>
      <p class="page-hero-subtitle">Track trends, check-in spikes, and department performance in real time.</p>
    </div>
  </header>

  <section class="page-section">
    <div class="container">
      <div class="detail-card feature-box">
        <div class="feature-detail-layout">
          <div class="feature-visual feature-visual-analytics">
            <i class="fas fa-chart-line"></i>
            <span>Real-Time Insights</span>
            <div class="feature-visual-caption">Trends and performance</div>
          </div>
          <div class="feature-detail-content">
            <h2>Analytics Controls</h2>
            <form id="analyticsForm" class="detail-form">
              <div class="detail-field">
                <label>Refresh Interval (minutes)</label>
                <input type="number" id="analyticsRefresh" min="1" max="120" placeholder="e.g. 5" />
              </div>
              <div class="detail-field">
                <label>Data Retention (days)</label>
                <input type="number" id="analyticsRetention" min="7" max="365" placeholder="e.g. 90" />
              </div>
              <div class="detail-field">
                <label>Anomaly Detection</label>
                <select id="analyticsAnomaly">
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
              <div class="detail-toggle">
                <label>Enable Live Department Rank</label>
                <input type="checkbox" id="analyticsRank" checked />
              </div>
              <div class="detail-toggle">
                <label>Show Heatmaps</label>
                <input type="checkbox" id="analyticsHeatmap" checked />
              </div>
              <div class="detail-form-actions">
                <button class="hero-btn-primary" type="submit"><i class="fas fa-save"></i> Save Settings</button>
                <button class="hero-btn-secondary" type="button" id="analyticsReset"><i class="fas fa-rotate-left"></i> Reset</button>
                <a class="hero-btn-secondary" href="dashboard.html">Open Dashboard</a>
              </div>
            </form>
            <div id="analyticsMsg" class="demo-result"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const key = 'analyticsSettings';
    const form = document.getElementById('analyticsForm');
    const msg = document.getElementById('analyticsMsg');

    const fields = {
      refresh: document.getElementById('analyticsRefresh'),
      retention: document.getElementById('analyticsRetention'),
      anomaly: document.getElementById('analyticsAnomaly'),
      rank: document.getElementById('analyticsRank'),
      heatmap: document.getElementById('analyticsHeatmap')
    };

    function loadSettings() {
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      fields.refresh.value = data.refresh || '';
      fields.retention.value = data.retention || '';
      fields.anomaly.value = data.anomaly || 'medium';
      fields.rank.checked = data.rank !== false;
      fields.heatmap.checked = data.heatmap !== false;
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        refresh: fields.refresh.value,
        retention: fields.retention.value,
        anomaly: fields.anomaly.value,
        rank: fields.rank.checked,
        heatmap: fields.heatmap.checked
      };
      localStorage.setItem(key, JSON.stringify(data));
      msg.textContent = 'Analytics settings saved.';
    });

    document.getElementById('analyticsReset').addEventListener('click', () => {
      localStorage.removeItem(key);
      loadSettings();
      msg.textContent = 'Settings reset.';
    });

    loadSettings();
  </script>
</body>
</html>
